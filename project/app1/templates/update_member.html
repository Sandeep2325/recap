{% extends "base.html" %}

{% block title %}Update member{% endblock %}

{% block content %}
<header>
  <div>
    <h1>Update member</h1>
    <p class="lead">Edit {{ member.firstname }} {{ member.lastname }}.</p>
  </div>
  <a class="btn btn-ghost" href="{% url 'members' %}">Back</a>
</header>

<div class="panel">
  <form method="post">
    {% csrf_token %}
    <label>
      First name
      <input type="text" name="firstname" value="{{ member.firstname }}" required maxlength="255" />
    </label>
    <label>
      Last name
      <input type="text" name="lastname" value="{{ member.lastname }}" required maxlength="255" />
    </label>
    <label>
      Phone
      <input type="number" name="phone" value="{{ member.phone|default_if_none:'' }}" />
    </label>
    <label>
      Joined date
      <input type="date" name="joined_date" value="{{ member.joined_date|date:'Y-m-d' }}" />
    </label>
    <div class="form-actions">
      <button class="btn btn-primary" type="submit">Update</button>
      <a class="btn btn-ghost" href="{% url 'members' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
