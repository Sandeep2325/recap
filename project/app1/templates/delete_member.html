{% extends "base.html" %}

{% block title %}Delete member{% endblock %}

{% block content %}
<header>
  <div>
    <h1>Delete member</h1>
    <p class="lead">This cannot be undone.</p>
  </div>
  <a class="btn btn-ghost" href="{% url 'members' %}">Back</a>
</header>

<div class="panel">
  <div class="warn">
    Delete <strong>{{ member.firstname }} {{ member.lastname }}</strong>?
  </div>
  <form method="post">
    {% csrf_token %}
    <div class="form-actions">
      <button class="btn btn-danger" type="submit">Yes, delete</button>
      <a class="btn btn-ghost" href="{% url 'members' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
